name: fidequiz
description: FideQuiz - O Quiz Católico Oficial. Teste sua fé e seus conhecimentos sobre a Bíblia, Santos, Anjos e História Católica.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0

  # Ads
  google_mobile_ads: ^5.2.0

  # State Management
  provider: ^6.1.2

  # Authentication
  google_sign_in: ^6.2.2

  # UI & Media
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
