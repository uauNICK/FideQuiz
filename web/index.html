<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FideQuiz - O Quiz da Fé Católica! Teste seus conhecimentos e aprenda sobre a Bíblia, Santos, Anjos e Doutrina.">
  <meta name="theme-color" content="#1B3A5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FideQuiz">

  <title>FideQuiz — O Quiz da Fé Católica</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #1B3A5C;
    }
    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #C9A84C;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #C9A84C;
      border-bottom-color: transparent;
      border-radius: 50%;
      animation: rotation 1s linear infinite;
      margin-bottom: 16px;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="title">FideQuiz</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
